name: PyPI wheel smoke test

# Round-trips a known model (SBML -> Antimony -> SBML) through antimony as
# published on PyPI, rather than this checkout's own build -- the same
# kind of check as sbmlutils' CI, which is what first caught issue #177
# (a win_amd64 3.2.0 wheel regression the source-build CI in main.yml
# never exercises, since it always builds from source).

on:
  push:
  workflow_dispatch:
    inputs:
      artifact-id:
        description: "Numeric id of the GitHub Actions artifact zip containing the wheel to test (from its URL: .../actions/runs/<run-id>/artifacts/<artifact-id>)"
        required: false
        default: "10469152607"

permissions:
  contents: read
  actions: read

jobs:
  roundtrip:
    name: pip install antimony (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # mirrors sbmlutils' matrix: linux covers the full range, windows
        # and macos only the newest version
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout Antimony
        uses: actions/checkout@main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID_INPUT: ${{ inputs.artifact-id }}
        run: |
          ARTIFACT_ID="${ARTIFACT_ID_INPUT:-10469152607}"
          echo "Downloading artifact $ARTIFACT_ID"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/sys-bio/antimony/actions/artifacts/$ARTIFACT_ID/zip" \
               -o artifact.zip
          python -m zipfile -e artifact.zip artifact_extracted

      - name: Install antimony wheel from artifact
        shell: bash
        run: |
          WHEEL=$(python -c "import glob, sys; m = glob.glob('artifact_extracted/**/*.whl', recursive=True); sys.exit('no .whl file found in artifact') if not m else print(m[0])")
          echo "Installing $WHEEL"
          python -m pip install "$WHEEL"

      - name: SBML -> Antimony -> SBML round trip (BIOMD0000000012, issue #177)
        run: python .github/scripts/pypi_roundtrip_smoke_test.py

  tests:
    name: pypi-smoke-test
    needs: roundtrip
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the test matrix
        env:
          RESULT: ${{ needs.roundtrip.result }}
        run: |
          echo "roundtrip matrix: $RESULT"
          test "$RESULT" = "success"
