name: PyPI wheel smoke test

# Round-trips a known model (SBML -> Antimony -> SBML) through antimony
# built fresh from this checkout, the same way main.yml's windows-latest-
# release/macos-14-release legs do (MSVC setup, antimony-deps binaries,
# CMake configure/build/install, then the Python wheel), but stripped down
# to just what's needed to produce an installable wheel -- no Qt, no
# ctest, no ccache. This is what first caught issue #177 (a win_amd64
# 3.2.0 wheel regression) via sbmlutils' CI; building here instead of
# installing a specific prior artifact means every push exercises whatever
# fix is currently in the tree.

on:
  push:
  workflow_dispatch:

env:
  ANTIMONY_DEPS_OWNER: sys-bio
  ANTIMONY_DEPS_REPO: libroadrunner-deps
  ANTIMONY_DEPS_NAME: antimony-deps
  ANTIMONY_DEPS_RELEASE_VERSION: v2.3.5

jobs:
  roundtrip:
    name: build + install antimony (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # mirrors sbmlutils' matrix: linux covers the full range, windows
        # and macos only the newest version
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout Antimony
        uses: actions/checkout@main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set MSVC as the default compiler on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get host architecture
        shell: bash
        run: echo "HOST_ARCHITECTURE=$(uname -m)" >> "${GITHUB_ENV}"

      - name: Download antimony-deps binaries
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/antimony-deps-binaries"
          cd "${RUNNER_TEMP}/antimony-deps-binaries"
          if [ "$RUNNER_OS" == "Windows" ]; then
            compiler_version=$(ls "C:\Program Files\Microsoft Visual Studio")
            binary_file_name="${ANTIMONY_DEPS_NAME}-windows-msvc${compiler_version}-${HOST_ARCHITECTURE}-Release"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            os_version=$(sw_vers -productVersion | cut -d '.' -f 1)
            binary_file_name="${ANTIMONY_DEPS_NAME}-macos-${os_version}-${HOST_ARCHITECTURE}-Release"
          else
            os_version=$(lsb_release -rs | cut -d '.' -f 1)
            binary_file_name="${ANTIMONY_DEPS_NAME}-ubuntu-${os_version}-${HOST_ARCHITECTURE}-Release"
          fi
          curl -LO "https://github.com/${ANTIMONY_DEPS_OWNER}/${ANTIMONY_DEPS_REPO}/releases/download/${ANTIMONY_DEPS_RELEASE_VERSION}/${binary_file_name}.zip"
          unzip -q "${binary_file_name}.zip"
          rm "${binary_file_name}.zip"
          if [ -d "$binary_file_name" ]; then
            mv "$binary_file_name"/* .
            rmdir "$binary_file_name"
          fi
          echo "ANT_DEPENDENCIES_INSTALL_PREFIX=-DANT_DEPENDENCIES_INSTALL_PREFIX=${RUNNER_TEMP}/antimony-deps-binaries" >> "${GITHUB_ENV}"

      - name: Configure CMake for Antimony
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/build-antimony"
          cd "${RUNNER_TEMP}/build-antimony"
          cmake "${GITHUB_WORKSPACE}" \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/install-antimony" \
          ${ANT_DEPENDENCIES_INSTALL_PREFIX} \
          -DWITH_QTANTIMONY=OFF \
          -DWITH_GTEST=OFF \
          -DWITH_PYTHON=ON

      - name: Build and install Antimony
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/build-antimony"
          cmake --build . --target install --config Release

      - name: Build antimony Python wheel
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/install-antimony/bindings/python"
          python -m pip install setuptools wheel build
          python -m build --wheel --no-isolation --outdir dist

      - name: Install antimony wheel
        shell: bash
        run: |
          WHEEL=$(python -c "import glob, sys; m = glob.glob('${RUNNER_TEMP}/install-antimony/bindings/python/dist/antimony*.whl'); sys.exit('no .whl file found') if not m else print(m[0])")
          echo "Installing $WHEEL"
          python -m pip install "$WHEEL"

      - name: SBML -> Antimony -> SBML round trip (BIOMD0000000012, issue #177)
        run: python .github/scripts/pypi_roundtrip_smoke_test.py

      - name: Upload generated Antimony text
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: generated-antimony-${{ matrix.os }}-py${{ matrix.python-version }}
          path: generated_antimony.txt
          if-no-files-found: ignore

  tests:
    name: pypi-smoke-test
    needs: roundtrip
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the test matrix
        env:
          RESULT: ${{ needs.roundtrip.result }}
        run: |
          echo "roundtrip matrix: $RESULT"
          test "$RESULT" = "success"
