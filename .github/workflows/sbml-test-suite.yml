name: SBMLTestSuiteRoundtrip
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'

jobs:
  sbml_test_suite_roundtrip:
    name: Round-trip SBML Test Suite through Antimony
    runs-on: ubuntu-latest
    env:
      libroadrunner_deps_owner: sys-bio
      libroadrunner_deps_repo: libroadrunner-deps
      libroadrunner_deps_name: libroadrunner-deps
      python_version: "3.13"

    steps:
      - name: Checkout Antimony
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: ${{ env.python_version }}

      - name: Download dependencies binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_WORKSPACE}"
          mkdir -p "${libroadrunner_deps_name}-binaries"
          cd "${libroadrunner_deps_name}-binaries"
          release_version=$(gh api "repos/${libroadrunner_deps_owner}/${libroadrunner_deps_repo}/releases/latest" --jq '.tag_name')
          if [ -z "$release_version" ]; then
            echo "::error::Failed to resolve the latest ${libroadrunner_deps_name} release tag."
            exit 1
          fi
          echo "Using latest ${libroadrunner_deps_name} release: ${release_version}"
          os_version=$(lsb_release -rs | cut -d '.' -f 1)
          binary_file_name="${libroadrunner_deps_name}-ubuntu-${os_version}-x86_64-Release"
          download_url="https://github.com/${libroadrunner_deps_owner}/${libroadrunner_deps_repo}/releases/download/${release_version}/${binary_file_name}.zip"
          echo "Downloading ${download_url}"
          curl -fLO "${download_url}"
          unzip -q "${binary_file_name}.zip"
          rm "${binary_file_name}.zip"
          echo "ANT_DEPENDENCIES_INSTALL_PREFIX=-DANT_DEPENDENCIES_INSTALL_PREFIX=${RUNNER_WORKSPACE}/${libroadrunner_deps_name}-binaries" >> "${GITHUB_ENV}"

      - name: Create build directory
        shell: bash
        run: mkdir -p "${RUNNER_WORKSPACE}/build-antimony"

      - name: Configure CMake for Antimony
        shell: bash
        run: |
          cd "${RUNNER_WORKSPACE}/build-antimony"
          cmake "$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_WORKSPACE}/install-antimony" \
            ${ANT_DEPENDENCIES_INSTALL_PREFIX} \
            -DWITH_QTANTIMONY=OFF \
            -DWITH_GTEST=OFF \
            -DWITH_PYTHON=ON

      - name: Build and install Antimony
        shell: bash
        run: |
          cd "${RUNNER_WORKSPACE}/build-antimony"
          cmake --build . --target install --config Release -- -j"$(nproc)"

      - name: Build and install Antimony Python wheel
        shell: bash
        run: |
          cd "${RUNNER_WORKSPACE}/install-antimony/bindings/python"
          python -m pip install setuptools wheel build
          python -m build --wheel --no-isolation --outdir dist
          python -m pip install dist/antimony*.whl

      - name: Install test requirements
        shell: bash
        run: python -m pip install -r "${GITHUB_WORKSPACE}/src/bindings/python/sbml_test_suite/requirements.txt"

      - name: Download SBML Test Suite semantic cases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_WORKSPACE}"
          mkdir -p sbml-test-suite
          asset_url=$(gh api repos/sbmlteam/sbml-test-suite/releases/latest \
            --jq '.assets[] | select(.name | startswith("semantic_tests")) | .browser_download_url')
          if [ -z "$asset_url" ]; then
            echo "::error::Failed to find a semantic_tests asset in the latest sbml-test-suite release."
            exit 1
          fi
          echo "Downloading ${asset_url}"
          curl -fL "$asset_url" -o sbml-test-suite/semantic_tests.zip
          unzip -q sbml-test-suite/semantic_tests.zip -d sbml-test-suite/extracted
          # -quit makes find stop after the first match itself, rather than
          # relying on a downstream `head -n 1` to cut it off -- piping into
          # head closes the pipe early and GNU find treats that broken pipe
          # as a fatal write error instead of exiting quietly.
          settings_file=$(find sbml-test-suite/extracted -name '*-settings.txt' -print -quit)
          if [ -z "$settings_file" ]; then
            echo "::error::No *-settings.txt files found under sbml-test-suite/extracted -- unexpected archive layout."
            exit 1
          fi
          cases_dir=$(dirname "$settings_file")
          echo "SBML_TEST_SUITE_DIR=$(dirname "$cases_dir")" >> "${GITHUB_ENV}"

      - name: Run SBML Test Suite round-trip tests
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/src/bindings/python/sbml_test_suite"
          python -m pytest -ra --junitxml="${RUNNER_WORKSPACE}/sbml-test-suite-results.xml" \
            --sbml-test-suite-dir="${SBML_TEST_SUITE_DIR}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: sbml-test-suite-results
          path: ${{ runner.workspace }}/sbml-test-suite-results.xml
